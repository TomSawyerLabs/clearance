# Clearance with a Postgres container beside it.
#
#   POSTGRES_PASSWORD=... docker compose -f deploy/compose.postgres.yml up -d
#
# For a managed Postgres, delete the `postgres` service and point DATABASE_URL
# at it. Put a reverse proxy with HTTPS in front of port 8080.
services:
  clearance:
    image: ghcr.io/cinderblock/clearance:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://clearance:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/clearance
    ports:
      - "127.0.0.1:8080:8080"

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: clearance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: clearance
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearance"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
