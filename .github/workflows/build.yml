name: Build image

# Push to master → check, build the image, push it to GHCR. That is the whole
# job: this repo publishes a *candidate*, it does not deploy.
#
# Which build actually runs is decided where the app is deployed, by pinning
# this image's digest there. This repo has no self-hosted runner and no access
# to any host.
on:
  push:
    branches:
      - master
    # Notes and documentation do not change what ships.
    paths-ignore:
      - "plans/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Gate quality before anything is published. A broken build must never
      # become a tag someone can deploy.
      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Install Chromium for the end-to-end test
        run: bunx playwright install --with-deps chromium

      - name: End-to-end test
        run: bun run test:e2e

      # GHCR image paths must be lowercase; the org name is mixed-case.
      - name: Resolve image name
        id: img
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # A pinnable sha tag for reproducible deploys, plus a moving latest.
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          # A deployment can verify this label against the commit its pin
          # claims, so a mistyped digest can't quietly ship a different build.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The tests above run the source; this runs the thing that ships. It
      # catches a binary that cannot start in the runtime image, and a data
      # directory the unprivileged user cannot write.
      - name: The published image starts and serves
        run: |
          docker run -d --name smoke -p 8080:8080 "${{ steps.img.outputs.name }}@${{ steps.push.outputs.digest }}"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/state | grep -q '"setupNeeded":true'; then
              curl -fsS -o /dev/null http://127.0.0.1:8080/
              docker logs smoke
              exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1

      # The way it runs behind a proxy on the same host: a unix socket in a
      # named volume shared with the proxy's container. The volume is created
      # EMPTY and root-owned beforehand, as a deploy script would, and the app
      # runs as uid 10001; this passes only because Docker gives an empty volume
      # the ownership of the image directory it is mounted over. A container
      # running as root stands in for the proxy (Caddy's image runs as root)
      # and connects through the socket; the default socket mode admits only
      # the app's user and root, so the client has to be root here.
      - name: The published image serves on a unix socket in a shared volume
        run: |
          docker volume create smoke_sock
          docker run -d --name smoke-sock \
            -v smoke_sock:/run/clearance \
            -e SOCKET_PATH=/run/clearance/clearance.sock \
            "${{ steps.img.outputs.name }}@${{ steps.push.outputs.digest }}"
          for attempt in $(seq 1 30); do
            if docker run --rm --user 0:0 -v smoke_sock:/s curlimages/curl:8.10.1 \
                 -fsS --unix-socket /s/clearance.sock http://clearance/api/state \
                 | grep -q '"setupNeeded":true'; then
              docker logs smoke-sock
              docker run --rm -v smoke_sock:/s alpine:3 ls -ln /s
              exit 0
            fi
            sleep 1
          done
          docker logs smoke-sock
          docker run --rm -v smoke_sock:/s alpine:3 ls -ln /s
          exit 1

      - name: Summarize how to deploy this build
        run: |
          {
            echo "### Image published"
            echo
            echo '```json'
            echo '{'
            echo '  "image": "${{ steps.img.outputs.name }}",'
            echo '  "digest": "${{ steps.push.outputs.digest }}",'
            echo '  "source": {'
            echo '    "repo": "${{ github.repository }}",'
            echo '    "commit": "${{ github.sha }}"'
            echo '  }'
            echo '}'
            echo '```'
            echo
            echo "Nothing runs this build until a deployment pins that digest."
          } >> "$GITHUB_STEP_SUMMARY"
